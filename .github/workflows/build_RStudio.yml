name: Custom Rockers Images NLP
on:
  push:
    branches:
      - '*'
      - '!main'
    paths:
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Dockerfile R Version
        id: extract_version
        run: |
          VERSION=$(grep '^FROM rocker/verse:' Dockerfile | sed 's/FROM rocker\/verse:[[:space:]]*//' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted Version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            cmzambranat/nlp:${{ steps.extract_version.outputs.version }}
            cmzambranat/nlp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
